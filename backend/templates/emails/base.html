<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MediCare Hub{% endblock %}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f7fa;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1a1a2e;
    }
    .wrapper {
      width: 100%;
      table-layout: fixed;
      background-color: #f4f7fa;
      padding: 40px 0;
    }
    .main {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }
    .header {
      background: linear-gradient(135deg, #0f766e, #0d9488);
      padding: 32px 40px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .content {
      padding: 40px;
    }
    .content h2 {
      margin: 0 0 16px;
      font-size: 22px;
      color: #0f172a;
    }
    .content p {
      margin: 0 0 16px;
      font-size: 16px;
      line-height: 1.6;
      color: #475569;
    }
    .button {
      display: inline-block;
      background: #0d9488;
      color: #ffffff !important;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      margin: 24px 0;
    }
    .info-box {
      background: #f0fdfa;
      border-left: 4px solid #0d9488;
      padding: 16px 20px;
      border-radius: 8px;
      margin: 24px 0;
    }
    .footer {
      background: #f8fafc;
      padding: 24px 40px;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
    }
    .footer a {
      color: #0d9488;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="main">
      <div class="header">
        <h1>MediCare Hub</h1>
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
      <div class="footer">
        <p>© 2026 MediCare Hub. All rights reserved.</p>
        <p>
          <a href="#">Privacy Policy</a> · 
          <a href="#">Terms of Service</a> · 
          <a href="#">Contact Support</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
